<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NEKI 앱 받기</title>
  <script>
    // QR로 들어오면 OS에 맞는 스토어로 보낸다. 판별이 안 되면 아래 버튼을 보여준다.
    var u = navigator.userAgent;
    if (/android/i.test(u)) location.replace('https://play.google.com/store/apps/details?id=com.neki.android');
    else if (/iphone|ipad|ipod/i.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) location.replace('https://apps.apple.com/kr/app/id6757490609');
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fff6f4; text-align: center; }
    a { display: block; padding: 16px 24px; border-radius: 12px; background: #202227; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <p>네키 앱을 받을 스토어를 골라주세요.</p>
  <a href="https://apps.apple.com/kr/app/id6757490609">App Store</a>
  <a href="https://play.google.com/store/apps/details?id=com.neki.android">Google Play</a>
</body>
</html>
