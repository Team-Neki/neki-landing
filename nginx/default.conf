server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
